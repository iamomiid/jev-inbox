<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jev Inbox promo marquee</title>
    <link rel="stylesheet" href="store.css" />
    <link rel="stylesheet" href="../../dist/section.css" />
    <style>
      .canvas.promo-marquee {
        align-items: stretch;
        justify-content: flex-start;
        padding: 0;
        overflow: hidden;
      }
      .marquee-copy {
        flex: none;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        padding: 0 64px;
      }
      .marquee-stage {
        position: relative;
        flex: 1;
        height: 100%;
      }
      .marquee-window {
        position: absolute;
        top: 64px;
        right: -70px;
        bottom: -60px;
        width: 780px;
        border-radius: 14px 0 0 0;
        background: #ffffff;
        border: 1px solid var(--store-window-border);
        box-shadow: 0 30px 60px -20px rgba(15, 15, 25, 0.35);
        overflow: hidden;
      }
      .marquee-window .window-bar,
      .marquee-window .mail-topbar {
        background: #ffffff;
      }
      .list-root {
        --page-bg: #ffffff;
        --page-text: #202124;
        --page-muted: #5f6368;
        --page-line: #e8eaed;
        width: 100%;
        background: var(--page-bg);
        color: var(--page-text);
        font-size: 14px;
      }
      .list-root .gc-root {
        padding-left: 18px;
        padding-right: 18px;
        font-size: 12px;
      }
      .list-root table {
        width: 100%;
        border-collapse: collapse;
      }
      .list-root tr.zA {
        border-bottom: 1px solid var(--page-line);
      }
      .list-root td {
        padding: 12px 18px;
        vertical-align: top;
      }
      .list-root td.xY {
        width: 190px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .list-root td.xW {
        width: 70px;
        text-align: right;
        color: var(--page-muted);
        font-size: 12px;
      }
      .list-root tr.zA.zE {
        font-weight: 700;
      }
      .list-root .y2 {
        display: block;
        margin-top: 2px;
        color: var(--page-muted);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <section class="canvas promo-marquee">
      <div class="marquee-copy">
        <div class="brand">
          <img src="../../assets/icon.svg" alt="" />
          <span style="font-size: 16px;">Jev Inbox</span>
        </div>
        <h1 class="headline" style="font-size: 42px;">Unread first.<br />Critical on top.</h1>
        <p class="subline" style="max-width: none;">
          Gmail's own list, reordered in place. The messages that matter most rise above the rest.
        </p>
      </div>
      <div class="marquee-stage">
        <div class="marquee-window">
          <div class="window-bar">
            <div class="window-dots"><span></span><span></span><span></span></div>
            <div class="window-address">mail.example.com/inbox</div>
          </div>
          <div class="mail-topbar">
            <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="#57606a" stroke-width="1.6">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            <span class="app-name">Mail</span>
            <div class="search"></div>
            <div class="avatar"></div>
          </div>
          <div class="list-root" id="list"></div>
        </div>
      </div>
    </section>
    <script>
      const rows = [
        {
          from: 'Migration Office',
          email: 'migration@office.example',
          subject: 'Your residence appointment is Monday at 9:00',
          time: '11:02',
          badge: 'Critical',
          chips: [{ name: 'Visa', hue: 0 }],
        },
        {
          from: 'Meadow Bank',
          email: 'statements@meadowbank.example',
          subject: 'Invoice 128 is due Friday',
          time: '09:48',
          badge: 'Critical',
          chips: [{ name: 'Money', hue: 1 }],
        },
        {
          from: 'Passport Office',
          email: 'appointments@passport.example',
          subject: 'Bring two photos to your appointment',
          time: '09:02',
          badge: 'Critical',
          chips: [{ name: 'Visa', hue: 0 }],
        },
      ];

      const bar = document.createElement('div');
      bar.className = 'gc-root';
      bar.id = 'gc-unread';
      const count = document.createElement('span');
      count.className = 'gc-count';
      count.textContent = `${rows.length} unread`;
      bar.appendChild(count);

      const table = document.createElement('table');
      const tbody = document.createElement('tbody');
      for (const row of rows) {
        const tr = document.createElement('tr');
        tr.className = 'zA zE';

        const fromCell = document.createElement('td');
        fromCell.className = 'xY';
        const fromSpan = document.createElement('span');
        fromSpan.className = 'zF';
        fromSpan.setAttribute('email', row.email);
        fromSpan.setAttribute('name', row.from);
        fromSpan.textContent = row.from;
        fromCell.appendChild(fromSpan);

        const subjectCell = document.createElement('td');
        const y6 = document.createElement('div');
        y6.className = 'y6';
        const chipsSlot = document.createElement('span');
        chipsSlot.className = 'gc-chips';
        const badge = document.createElement('span');
        badge.className = 'gc-badge';
        badge.textContent = row.badge;
        chipsSlot.appendChild(badge);
        for (const chip of row.chips) {
          const chipEl = document.createElement('span');
          chipEl.className = `gc-chip gc-hue-${chip.hue}`;
          chipEl.textContent = chip.name;
          chipsSlot.appendChild(chipEl);
        }
        y6.appendChild(chipsSlot);
        const bog = document.createElement('span');
        bog.className = 'bog';
        const bqe = document.createElement('span');
        bqe.className = 'bqe';
        bqe.textContent = row.subject;
        bog.appendChild(bqe);
        y6.appendChild(bog);
        subjectCell.appendChild(y6);

        const timeCell = document.createElement('td');
        timeCell.className = 'xW';
        const timeSpan = document.createElement('span');
        timeSpan.textContent = row.time;
        timeCell.appendChild(timeSpan);

        tr.appendChild(fromCell);
        tr.appendChild(subjectCell);
        tr.appendChild(timeCell);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      const list = document.getElementById('list');
      list.appendChild(bar);
      list.appendChild(table);
    </script>
  </body>
</html>
