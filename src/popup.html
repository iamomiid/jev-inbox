<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gmail Critical</title>
    <style>
      body {
        font-family: Roboto, "Google Sans", Arial, sans-serif;
        font-size: 13px;
        color: #202124;
        width: 260px;
        margin: 0;
        padding: 12px;
      }
      label,
      .row-label {
        display: block;
        font-size: 11px;
        color: #5f6368;
        margin: 10px 0 4px 0;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 13px;
      }
      input[type="range"] {
        width: 100%;
      }
      button {
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: #3c4043;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background: #f8f9fa;
      }
      #saved {
        display: none;
        margin-left: 8px;
        color: #188038;
      }
      .label-error {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #d93025;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toggle-row span {
        color: #202124;
      }
      .label-row {
        margin: 6px 0;
      }
      .label-row input {
        margin: 2px 0;
      }
      .label-row button {
        margin: 0;
        padding: 2px 8px;
      }
    </style>
  </head>
  <body>
    <div class="toggle-row">
      <input id="enabled" type="checkbox" />
      <span>Enabled</span>
    </div>
    <p class="row-label" style="margin-top: 12px">Show on</p>
    <div class="toggle-row">
      <input id="viewInbox" type="checkbox" />
      <span>Inbox (Primary)</span>
    </div>
    <div class="toggle-row">
      <input id="viewTabs" type="checkbox" />
      <span>Other inbox tabs</span>
    </div>
    <div class="toggle-row">
      <input id="viewSearch" type="checkbox" />
      <span>Search results</span>
    </div>
    <div class="toggle-row">
      <input id="viewOther" type="checkbox" />
      <span>Labels and other folders</span>
    </div>
    <label for="apiKey">TypeSafe Jev API key</label>
    <input id="apiKey" type="password" autocomplete="off" />
    <label for="threshold">Show if critical probability &ge; <span id="thresholdValue"></span></label>
    <input id="threshold" type="range" min="0.5" max="0.95" step="0.05" />
    <p class="row-label" style="margin-top: 12px">Labels</p>
    <div id="labels"></div>
    <button id="addLabel" type="button">Add label</button>
    <button id="saveLabels" type="button">Save labels</button>
    <span id="labelError" class="label-error"></span>
    <p class="row-label" style="margin-top: 12px">Cache holds past classifications.</p>
    <button id="clear">Clear cache</button>
    <span id="saved">Saved</span>
    <script src="popup.js"></script>
  </body>
</html>
